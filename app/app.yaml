command:
  - "uvicorn"
  - "main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
env:
  - name: DATABRICKS_HOST
    value: https://fevm-serverless-stable-1acr1x.cloud.databricks.com
  - name: DATABRICKS_WAREHOUSE_ID
    value: "4484f27c707c5a31"
  - name: SPEC_CATALOG
    value: serverless_stable_1acr1x_catalog
  - name: SPEC_SCHEMA
    value: spec_docs
  - name: LLM_ENDPOINT
    value: databricks-meta-llama-3-3-70b-instruct
  - name: EMBEDDING_ENDPOINT
    value: databricks-bge-large-en
resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "4484f27c707c5a31"
      permission: CAN_USE
  - name: model-serving
    serving_endpoint:
      name: "databricks-meta-llama-3-3-70b-instruct"
      permission: CAN_QUERY
  - name: diff-model
    serving_endpoint:
      name: "databricks-claude-opus-4-8"
      permission: CAN_QUERY
  - name: embedding-serving
    serving_endpoint:
      name: "databricks-bge-large-en"
      permission: CAN_QUERY
