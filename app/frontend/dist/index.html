<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spec Intelligence — Element</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              element: { blue: '#009DDC', 'blue-dark': '#003B5C', navy: '#0a1628', cyan: '#00d4ff' },
              glass: { 50: 'rgba(255,255,255,0.03)', 100: 'rgba(255,255,255,0.06)', 200: 'rgba(255,255,255,0.10)' },
            },
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
            boxShadow: {
              'glass': '0 8px 32px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06)',
              'glow': '0 0 20px rgba(0,157,220,0.25)',
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: #0a1628; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,157,220,0.2); border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,157,220,0.4); }

      .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
      .glass-strong { background: rgba(255,255,255,0.05); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.08); }
      .glass-sidebar { background: rgba(6,25,50,0.85); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-right: 1px solid rgba(0,157,220,0.1); }
      .glass-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s ease; }
      .glass-card:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); }
      .glass-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }
      .glass-input:focus { border-color: rgba(0,157,220,0.4); box-shadow: 0 0 0 2px rgba(0,157,220,0.08); outline: none; }

      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideLeft { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes slideRight { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes dotPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      .fade-up { animation: fadeUp 0.35s ease forwards; opacity: 0; }
      .slide-left { animation: slideLeft 0.35s ease forwards; opacity: 0; }
      .slide-right { animation: slideRight 0.35s ease forwards; opacity: 0; }
      .typing-dot { animation: dotPulse 1.4s ease-in-out infinite; }
      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }
      .spinner { animation: spin 1s linear infinite; }

      .drop-zone { border: 2px dashed rgba(0,157,220,0.3); transition: all 0.2s; }
      .drop-zone.active { border-color: rgba(0,157,220,0.8); background: rgba(0,157,220,0.05); }
    </style>
</head>
<body class="text-white antialiased min-h-screen overflow-hidden">
    <div id="root"></div>
    <script type="text/babel" src="assets/index.js"></script>
</body>
</html>
