    <style>

      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      .typing-dot:nth-child(2) { animation-delay: 0.2s; }

      .drop-zone.active { border-color: rgba(0,157,220,0.8); background: rgba(0,157,220,0.05); }

      .bbox-overlay { position: absolute; border: 2px solid rgba(0,157,220,0.6); background: rgba(0,157,220,0.05); cursor: pointer; transition: all 0.2s; border-radius: 3px; }
      .bbox-overlay:hover { border-color: rgba(0,157,220,1); background: rgba(0,157,220,0.12); box-shadow: 0 0 12px rgba(0,157,220,0.3); }
      .bbox-overlay.active { border-color: #00d4ff; background: rgba(0,212,255,0.1); box-shadow: 0 0 16px rgba(0,212,255,0.4); }
      .bbox-level-1 { border-color: rgba(0,157,220,0.7); }

      .section-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
      .section-item:hover { background: rgba(255,255,255,0.03); }
      .section-item.active { background: rgba(0,157,220,0.08); border-left-color: #009DDC; }
    </style>
</head>
<body class="antialiased min-h-screen overflow-hidden">
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">

const { useState, useEffect, useRef } = React;
const API = window.location.origin;

async function apiPost(path, body) {
  var r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status + ": " + (await r.text()));
  return r.json();
}
async function apiGet(path) {
  var r = await fetch(API + path);
  if (!r.ok) throw new Error("" + r.status);
  return r.json();
}
async function apiUpload(path, file) {
  var form = new FormData(); form.append("file", file);
  var r = await fetch(API + path, { method: "POST", body: form });
  if (!r.ok) throw new Error(r.status + ": " + (await r.text()));
  return r.json();
}

function renderMd(text) {
  if (!text) return "";
  var s = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s = s.replace(/\*\*(.*?)\*\*/g,"<strong style='color:#fff;font-weight:600'>$1</strong>");
  s = s.replace(/\*(.*?)\*/g,"<em>$1</em>");
  s = s.replace(/`(.*?)`/g,"<code style='background:rgba(0,157,220,0.1);padding:2px 6px;border-radius:4px;font-size:11px;font-family:monospace;color:#00d4ff'>$1</code>");
  s = s.replace(/^### (.*$)/gm,"<h3 style='font-size:14px;font-weight:700;color:#fff;margin:12px 0 4px'>$1</h3>");
  s = s.replace(/^## (.*$)/gm,"<h2 style='font-size:16px;font-weight:700;color:#fff;margin:16px 0 8px'>$1</h2>");
  s = s.replace(/^- (.*$)/gm,"<div style='margin-left:16px;padding:2px 0'>&#8226; $1</div>");
  s = s.replace(/^\d+\. (.*$)/gm,"<div style='margin-left:16px;padding:2px 0'>$1</div>");
  s = s.replace(/\n/g,"<br/>");
  return s;
}

function IconDoc() { return <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>; }
function IconUpload() { return <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>; }
function IconChat() { return <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" /></svg>; }
function IconCompare() { return <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" /></svg>; }
function IconEye() { return <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>; }
function IconDownload() { return <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>; }

// ============ DOCUMENT VIEWER — SPLIT SCREEN WITH BOUNDING BOXES ============
function DocumentViewer({ documentId, onClose }) {
  const [viewerData, setViewerData] = useState(null);
  const [currentPage, setCurrentPage] = useState(1);
  const [pageData, setPageData] = useState(null);
  const [loadingPage, setLoadingPage] = useState(false);
  const [activeSection, setActiveSection] = useState(null);
  const imgRef = useRef(null);

  useEffect(function() {
    apiGet("/api/viewer/" + documentId).then(setViewerData).catch(function(e){ console.error(e); });
  }, [documentId]);

  useEffect(function() {
    if (!documentId) return;
    setLoadingPage(true);
    apiGet("/api/viewer/" + documentId + "/page/" + currentPage).then(function(data) {
      setPageData(data);
      setLoadingPage(false);
    }).catch(function(e){ setLoadingPage(false); console.error(e); });
  }, [documentId, currentPage]);

  function goToPage(p) { if (p >= 1 && p <= (viewerData ? viewerData.page_count : 1)) setCurrentPage(p); }

  var levelColors = { 1: "#009DDC", 2: "#10b981", 3: "#f59e0b", 4: "#8b5cf6" };

  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      {/* Header bar */}
      <div className="glass-banner" style={{borderRadius:"16px",margin:"16px 16px 0",padding:"12px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
          <button onClick={onClose} style={{padding:"6px 12px",borderRadius:"8px",fontSize:"12px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#fff",cursor:"pointer"}}>&#8592; Back</button>
          <div>
            <div style={{fontSize:"14px",fontWeight:"700"}}>{viewerData ? viewerData.filename : "Loading..."}</div>
            <div style={{fontSize:"11px",color:"rgba(255,255,255,0.4)"}}>{viewerData ? viewerData.spec_number + " | " + viewerData.issue_year + " | " + viewerData.page_count + " pages" : ""}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
          <button onClick={function(){goToPage(currentPage-1)}} disabled={currentPage<=1} style={{padding:"6px 10px",borderRadius:"6px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#fff",cursor:"pointer",opacity:currentPage<=1?0.3:1}}>&#9664;</button>
          <span style={{fontSize:"12px",fontWeight:"600",minWidth:"80px",textAlign:"center"}}>Page {currentPage} / {viewerData ? viewerData.page_count : "?"}</span>
          <button onClick={function(){goToPage(currentPage+1)}} disabled={viewerData && currentPage>=viewerData.page_count} style={{padding:"6px 10px",borderRadius:"6px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#fff",cursor:"pointer",opacity:(viewerData && currentPage>=viewerData.page_count)?0.3:1}}>&#9654;</button>
        </div>
      </div>

      {/* Split screen: PDF left | Sections right */}
      <div style={{flex:1,display:"flex",margin:"16px",gap:"16px",overflow:"hidden"}}>
        {/* PDF Viewer with bounding boxes */}
        <div style={{flex:2,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div className="glass-card" style={{borderRadius:"16px",flex:1,overflow:"auto",position:"relative",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"16px"}}>
            {loadingPage && (
              <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",zIndex:10}}>
                <div className="spinner" style={{width:"40px",height:"40px",border:"2px solid rgba(0,212,255,0.3)",borderTopColor:"#00d4ff",borderRadius:"50%"}}></div>
              </div>
            )}
            {pageData && pageData.page_image && (
              <div style={{position:"relative",display:"inline-block"}}>
                <img ref={imgRef} src={"data:image/png;base64," + pageData.page_image} alt={"Page " + currentPage} style={{maxWidth:"100%",height:"auto",borderRadius:"4px",boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}} />
                {/* Bounding box overlays */}
                {(pageData.sections_on_page || []).map(function(sec, i) {
                  var imgEl = imgRef.current;
                  if (!imgEl || !pageData.page_width) return null;
                  var scaleX = imgEl.clientWidth / pageData.page_width;
                  var scaleY = imgEl.clientHeight / pageData.page_height;
                  var bbox = sec.bbox;
                  if (!bbox) return null;
                  var isActive = activeSection === sec.text;
                  return (
                    <div key={i}
                      className={"bbox-overlay bbox-level-" + (sec.level || 1) + (isActive ? " active" : "")}
                      onClick={function(){setActiveSection(sec.text)}}
                      style={{
                        left: (bbox.x0 * scaleX) + "px",
                        top: (bbox.y0 * scaleY) + "px",
                        width: ((bbox.x1 - bbox.x0) * scaleX) + "px",
                        height: ((bbox.y1 - bbox.y0) * scaleY) + "px",
                      }}
                      title={sec.text}
                    ></div>
                  );
                })}
              </div>
            )}
            {!pageData && !loadingPage && (
              <div style={{color:"rgba(255,255,255,0.3)",fontSize:"13px",marginTop:"100px"}}>Select a document to view</div>
            )}
          </div>
        </div>

        {/* Section panel (right side) */}
        <div style={{flex:1,minWidth:"280px",maxWidth:"360px",display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div className="glass-card" style={{borderRadius:"16px",flex:1,overflow:"auto",padding:"16px"}}>
            <h3 style={{fontSize:"11px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,0.4)",margin:"0 0 12px"}}>Document Structure</h3>
            {viewerData && viewerData.sections && viewerData.sections.length > 0 ? (
              <div style={{display:"flex",flexDirection:"column",gap:"2px"}}>
                {viewerData.sections.map(function(sec, i) {
                  var indent = ((parseInt(sec.section_level) || 1) - 1) * 16;
                  var isActive = activeSection === sec.section_title;
                  var lvl = parseInt(sec.section_level) || 1;
                  var color = levelColors[lvl] || "#fff";
                  return (
                    <div key={i}
                      className={"section-item" + (isActive ? " active" : "")}
                      style={{paddingLeft:(12 + indent)+"px"}}
                      onClick={function(){ setActiveSection(sec.section_title); if(sec.start_page) goToPage(parseInt(sec.start_page)); }}
                    >
                      <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                        <div style={{width:"6px",height:"6px",borderRadius:"50%",background:color,flexShrink:0}}></div>
                        <span style={{fontSize:"12px",fontWeight:lvl===1?"600":"400",color:isActive?"#fff":"rgba(255,255,255,0.7)"}}>{sec.section_title}</span>
                      </div>
                      <div style={{fontSize:"10px",color:"rgba(255,255,255,0.3)",marginLeft:"14px",marginTop:"2px"}}>
                        {sec.section_number ? "§" + sec.section_number + " " : ""}Page {sec.start_page}{sec.end_page && sec.end_page !== sec.start_page ? "-"+sec.end_page : ""} | {sec.word_count} words
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div style={{color:"rgba(255,255,255,0.3)",fontSize:"12px",textAlign:"center",padding:"40px 0"}}>
                {viewerData ? "No sections detected" : "Loading..."}
              </div>
            )}
          </div>

          {/* Summary panel */}
          {viewerData && (
            <div className="glass-card" style={{borderRadius:"16px",padding:"16px",marginTop:"12px"}}>
              <h3 style={{fontSize:"11px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"1px",color:"rgba(255,255,255,0.4)",margin:"0 0 8px"}}>Summary</h3>
              <div style={{fontSize:"11px",color:"rgba(255,255,255,0.6)",lineHeight:"1.6"}}>
                <div><strong style={{color:"#fff"}}>Spec:</strong> {viewerData.spec_number || "—"}</div>
                <div><strong style={{color:"#fff"}}>Year:</strong> {viewerData.issue_year || "—"}</div>
                <div><strong style={{color:"#fff"}}>Status:</strong> <span style={{color:viewerData.status==="current"?"#6ee7b7":"#fcd34d"}}>{viewerData.status || "—"}</span></div>
                <div><strong style={{color:"#fff"}}>Title:</strong> {viewerData.title || "—"}</div>
                <div><strong style={{color:"#fff"}}>Sections:</strong> {viewerData.sections ? viewerData.sections.length : 0}</div>
                <div><strong style={{color:"#fff"}}>Pages:</strong> {viewerData.page_count}</div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ============ DOCUMENT LIBRARY ============
function DocumentLibrary({ documents, onRefresh, loading, onViewDoc }) {
  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div className="glass-banner" style={{borderRadius:"16px",margin:"24px 24px 0",padding:"24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <h2 style={{fontSize:"20px",fontWeight:"700",margin:0}}>Document Library</h2>
          <p style={{fontSize:"13px",color:"rgba(255,255,255,0.5)",margin:"4px 0 0"}}>{documents.length} specifications indexed</p>
        </div>
        <button onClick={onRefresh} disabled={loading} style={{padding:"10px 20px",borderRadius:"12px",fontSize:"12px",fontWeight:"600",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(0,157,220,0.3)",color:"#00d4ff",cursor:"pointer"}}>{loading ? "Loading..." : "Refresh"}</button>
      </div>
      <div style={{flex:1,overflow:"auto",padding:"24px"}}>
        {documents.length === 0 ? (
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%"}}>
            <div className="pulse-glow" style={{width:"64px",height:"64px",borderRadius:"16px",display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",marginBottom:"20px"}}><IconDoc /></div>
            <h3 style={{fontSize:"16px",fontWeight:"600",color:"rgba(255,255,255,0.6)",margin:0}}>No documents yet</h3>
            <p style={{fontSize:"13px",color:"rgba(255,255,255,0.3)",marginTop:"8px"}}>Upload PDF specifications to get started</p>
          </div>
        ) : (
          <div style={{display:"grid",gap:"12px"}}>
            {documents.map(function(doc, i) {
              return (
                <div key={doc.document_id || i} className="glass-card fade-up" style={{borderRadius:"12px",padding:"16px",animationDelay:i*50+"ms",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"6px"}}>
                      <h4 style={{fontSize:"13px",fontWeight:"600",margin:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{doc.original_file_name}</h4>
                      <span style={{padding:"2px 8px",borderRadius:"10px",fontSize:"9px",fontWeight:"700",textTransform:"uppercase",background:(doc.status||doc.parsing_status)==="completed"||doc.status==="current"?"rgba(16,185,129,0.15)":"rgba(245,158,11,0.15)",border:"1px solid "+((doc.status||doc.parsing_status)==="completed"||doc.status==="current"?"rgba(16,185,129,0.3)":"rgba(245,158,11,0.3)"),color:(doc.status||doc.parsing_status)==="completed"||doc.status==="current"?"#6ee7b7":"#fcd34d"}}>{doc.status || doc.parsing_status || "unknown"}</span>
                    </div>
                    <div style={{display:"flex",gap:"16px",fontSize:"11px",color:"rgba(255,255,255,0.4)"}}>
                      {doc.spec_number && <span style={{fontFamily:"monospace",color:"#00d4ff"}}>{doc.spec_number}</span>}
                      {doc.issue_year && <span>Year: {doc.issue_year}</span>}
                      {doc.page_count && <span>{doc.page_count} pages</span>}
                    </div>
                  </div>
                  <button onClick={function(){onViewDoc(doc.document_id)}} style={{padding:"8px 16px",borderRadius:"10px",fontSize:"11px",fontWeight:"600",background:"linear-gradient(135deg,#009DDC,#003B5C)",color:"#fff",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
                    <IconEye /> View
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ============ UPLOAD PAGE ============
function UploadPage({ onUploadComplete }) {
  const [processing, setProcessing] = useState(false);
  const [documentId, setDocumentId] = useState(null);
  const [progress, setProgress] = useState(null);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(false);
  const [isDragging, setIsDragging] = useState(false);
  const fileInputRef = useRef(null);
  const pollRef = useRef(null);

  function stopPolling() { if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; } }
  function startPolling(docId) {
    stopPolling();
    pollRef.current = setInterval(async function() {
      try {
        var r = await apiGet("/api/documents/" + docId + "/progress");
        setProgress(r);
        if (r.status === "completed" || r.status === "failed") { stopPolling(); setProcessing(false); setDone(true); if (r.status === "completed" && onUploadComplete) onUploadComplete(); }
      } catch(e) {}
    }, 1500);
  }
  useEffect(function() { return function() { stopPolling(); }; }, []);

  async function processFile(file) {
    setProcessing(true); setError(null); setProgress(null); setDone(false);
    try {
      var result = await apiUpload("/api/documents/upload", file);
      setDocumentId(result.document_id);
      startPolling(result.document_id);
    } catch(err) { setError(err.message); setProcessing(false); }
  }
  function handleDrop(e) { e.preventDefault(); setIsDragging(false); var files = Array.from(e.dataTransfer.files).filter(function(f){return f.name.toLowerCase().endsWith(".pdf")}); if(files.length>0) processFile(files[0]); }

  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>

      </div>
      <div style={{flex:1,padding:"24px",overflow:"auto"}}>
        {!processing && !done && (
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%"}}>
            <div className={"drop-zone"+(isDragging?" active":"")} style={{borderRadius:"24px",padding:"64px",textAlign:"center",maxWidth:"480px",width:"100%",cursor:"pointer"}}
              onDragOver={function(e){e.preventDefault();setIsDragging(true)}} onDragLeave={function(){setIsDragging(false)}}
              onDrop={handleDrop} onClick={function(){fileInputRef.current && fileInputRef.current.click()}}>
              <div className="pulse-glow" style={{width:"64px",height:"64px",borderRadius:"16px",display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",margin:"0 auto 16px"}}><IconUpload /></div>
              <div style={{fontSize:"15px",color:"rgba(255,255,255,0.7)",fontWeight:"500"}}>Drop PDF here or click to browse</div>
              <div style={{fontSize:"12px",color:"rgba(255,255,255,0.3)",marginTop:"8px"}}>Deep section parsing with bounding box detection</div>
              <input ref={fileInputRef} type="file" accept=".pdf" style={{display:"none"}} onChange={function(e){if(e.target.files[0])processFile(e.target.files[0])}} />
            </div>
            {error && <div style={{marginTop:"24px",padding:"16px",borderRadius:"12px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",fontSize:"13px",color:"#fca5a5"}}>{error}</div>}
          </div>
        )}
        {(processing || done) && progress && (
          <div className="fade-up" style={{maxWidth:"600px",margin:"0 auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"16px"}}>
              <h3 style={{fontSize:"15px",fontWeight:"700",margin:0}}>Pipeline</h3>
              <span style={{fontSize:"11px",fontWeight:"700",padding:"4px 12px",borderRadius:"12px",background:progress.status==="completed"?"rgba(16,185,129,0.15)":"rgba(0,157,220,0.15)",color:progress.status==="completed"?"#6ee7b7":"#00d4ff",border:"1px solid "+(progress.status==="completed"?"rgba(16,185,129,0.3)":"rgba(0,157,220,0.3)")}}>{progress.status==="completed"?"DONE":"RUNNING"}</span>
            </div>
            <div style={{height:"6px",borderRadius:"3px",background:"rgba(255,255,255,0.05)",marginBottom:"16px",overflow:"hidden"}}><div style={{height:"100%",borderRadius:"3px",background:progress.status==="completed"?"#10b981":"linear-gradient(90deg,#009DDC,#00d4ff)",width:(progress.percent||0)+"%",transition:"width 0.5s"}}></div></div>
            <div className="glass-card" style={{borderRadius:"12px",padding:"8px"}}>
              {(progress.steps||[]).map(function(step,i){
                var color = step.status==="completed"?"#6ee7b7":step.status==="running"?"#00d4ff":step.status==="failed"?"#fca5a5":"rgba(255,255,255,0.3)";
                return <div key={i} style={{display:"flex",alignItems:"center",gap:"12px",padding:"10px 12px"}}>
                  <div style={{width:"8px",height:"8px",borderRadius:"50%",background:color}}></div>

                </div>;

            </div>
            {done && <div style={{marginTop:"20px",textAlign:"center"}}><button onClick={function(){setProcessing(false);setDone(false);setProgress(null);setError(null)}} style={{padding:"10px 24px",borderRadius:"12px",fontSize:"12px",fontWeight:"600",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(0,157,220,0.3)",color:"#00d4ff",cursor:"pointer"}}>Upload Another</button></div>}

    </div>
  );
}

            {(pageData.sections_on_page||[]).map(function(sec,i){

        {results&&results.conclusion&&selectedDocs.length>=2&&(
          <div className="fade-up glass-card" style={{borderRadius:"12px",flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
            <div style={{padding:"8px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid rgba(255,255,255,0.05)",flexShrink:0}}>
              <span style={{fontSize:"11px",fontWeight:"700",color:"rgba(255,255,255,0.5)"}}>DOCUMENT COMPARISON VIEW</span>
              <label style={{display:"flex",alignItems:"center",gap:"6px",fontSize:"10px",color:"rgba(255,255,255,0.4)",cursor:"pointer"}}>
                <input type="checkbox" checked={syncPages} onChange={function(e){setSyncPages(e.target.checked)}} style={{accentColor:"#009DDC"}} />
                Sync pages
              </label>
            </div>
            <div style={{flex:1,display:"flex",overflow:"hidden"}}>
              <CompareDocPanel documentId={selectedDocs[0]} label="OLD" currentPage={leftPage} onPageChange={handleLeftPage} />
              {/* Center diff panel */}
              <div style={{width:"240px",flexShrink:0,borderLeft:"1px solid rgba(255,255,255,0.05)",borderRight:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.15)",overflow:"hidden"}}>
                <PageDiffPanel docIdOld={selectedDocs[0]} docIdNew={selectedDocs[1]} page={leftPage} />
              </div>
              <CompareDocPanel documentId={selectedDocs[1]} label="NEW" currentPage={rightPage} onPageChange={handleRightPage} />
            </div>
          </div>
        )}

        {!results&&!loading&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:"rgba(255,255,255,0.3)",fontSize:"13px"}}>Select documents above and click Compare</div>}
      </div>
    </div>
  );
}

// ============ MAIN APP ============
function App() {
  const [page, setPage] = useState("library");
  const [documents, setDocuments] = useState([]);
  const [docsLoading, setDocsLoading] = useState(false);
  const [viewingDoc, setViewingDoc] = useState(null);

  async function loadDocuments() {
    setDocsLoading(true);
    try { var r = await apiGet("/api/documents"); setDocuments(r.documents||[]); } catch(e){}
    setDocsLoading(false);
  }
  useEffect(function(){loadDocuments()}, []);

  if (viewingDoc) {
    return <DocumentViewer documentId={viewingDoc} onClose={function(){setViewingDoc(null)}} />;
  }

  var NAV = [
    {id:"library",label:"Documents",Icon:IconDoc},
    {id:"upload",label:"Upload",Icon:IconUpload},
    {id:"chat",label:"Chat",Icon:IconChat},
    {id:"compare",label:"Compare",Icon:IconCompare},
  ];

  return (
    <div style={{height:"100vh",display:"flex"}}>
      <div className="glass-sidebar" style={{width:"220px",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"20px",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <img src="/images/element-logo.png" alt="Element" style={{height:"28px"}} onError={function(e){e.target.style.display="none"}} />
            <div><div style={{fontSize:"13px",fontWeight:"700"}}>Spec Intelligence</div><div style={{fontSize:"9px",color:"rgba(0,212,255,0.6)",fontWeight:"600"}}>PLATFORM</div></div>
          </div>
        </div>
        <nav style={{flex:1,padding:"12px"}}>
          {NAV.map(function(item){var active=page===item.id; return <button key={item.id} onClick={function(){setPage(item.id)}} className={active?"nav-active":""} style={{width:"100%",display:"flex",alignItems:"center",gap:"12px",padding:"11px 14px",borderRadius:"10px",fontSize:"12px",fontWeight:"500",color:active?"#fff":"rgba(255,255,255,0.4)",cursor:"pointer",border:active?undefined:"1px solid transparent",background:active?undefined:"transparent",marginBottom:"4px"}}><item.Icon />{item.label}</button>;})}
        </nav>
        <div style={{padding:"14px",borderTop:"1px solid rgba(255,255,255,0.05)"}}>
          <div className="glass" style={{borderRadius:"10px",padding:"10px",fontSize:"10px"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}><span style={{color:"rgba(255,255,255,0.3)"}}>Docs</span><span style={{color:"rgba(255,255,255,0.6)"}}>{documents.length}</span></div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}><span style={{color:"rgba(255,255,255,0.3)"}}>LLM</span><span style={{color:"#6ee7b7"}}>Llama 3.3 70B</span></div>
            <div style={{display:"flex",justifyContent:"space-between"}}><span style={{color:"rgba(255,255,255,0.3)"}}>Storage</span><span style={{color:"rgba(255,255,255,0.6)"}}>Unity Catalog</span></div>
          </div>
        </div>
      </div>
      <div className="bg-mesh" style={{flex:1,overflow:"hidden"}}>
        {page==="library"&&<DocumentLibrary documents={documents} onRefresh={loadDocuments} loading={docsLoading} onViewDoc={setViewingDoc} />}
        {page==="upload"&&<UploadPage onUploadComplete={loadDocuments} />}
        {page==="chat"&&<ChatPage />}
        {page==="compare"&&<ComparePage documents={documents} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
